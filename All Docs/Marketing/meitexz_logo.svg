<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06b6d4"/>
      <stop offset="50%" style="stop-color:#0891b2"/>
      <stop offset="100%" style="stop-color:#0d1b2a"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d1b2a"/>
      <stop offset="100%" style="stop-color:#1e3a5f"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── ICON MARK ── -->
  <!-- Outer hexagon -->
  <polygon points="40,4 68,20 68,52 40,68 12,52 12,20"
    fill="url(#iconGrad)" />
  <!-- Inner glow ring -->
  <polygon points="40,10 62,23 62,49 40,62 18,49 18,23"
    fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Textile weave pattern inside hex -->
  <!-- Horizontal threads (weft) -->
  <line x1="16" y1="26" x2="64" y2="26" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="13" y1="36" x2="67" y2="36" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="16" y1="46" x2="64" y2="46" stroke="rgba(255,255,255,0.9)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Vertical threads (warp) — alternating over/under -->
  <line x1="28" y1="14" x2="28" y2="58" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="40" y1="8"  x2="40" y2="64" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="52" y1="14" x2="52" y2="58" stroke="rgba(255,255,255,0.35)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Connector dots at intersections (ERP network nodes) -->
  <circle cx="28" cy="26" r="2.5" fill="white" opacity="0.95"/>
  <circle cx="40" cy="26" r="2.5" fill="white" opacity="0.95"/>
  <circle cx="52" cy="26" r="2.5" fill="white" opacity="0.95"/>
  <circle cx="28" cy="36" r="2.5" fill="#a5f3fc" opacity="0.95"/>
  <circle cx="40" cy="36" r="3.5" fill="white"/>
  <circle cx="52" cy="36" r="2.5" fill="#a5f3fc" opacity="0.95"/>
  <circle cx="28" cy="46" r="2.5" fill="white" opacity="0.95"/>
  <circle cx="40" cy="46" r="2.5" fill="white" opacity="0.95"/>
  <circle cx="52" cy="46" r="2.5" fill="white" opacity="0.95"/>

  <!-- ── WORDMARK ── -->
  <!-- MEI TEXZ -->
  <text x="84" y="44"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="28" font-weight="900"
    letter-spacing="3"
    fill="url(#textGrad)">MEI TEXZ</text>

  <!-- Divider line between name and sub -->
  <line x1="84" y1="50" x2="298" y2="50" stroke="#0891b2" stroke-width="1.5" opacity="0.6"/>

  <!-- TECHNOLOGIES -->
  <text x="84" y="63"
    font-family="'Inter','Helvetica Neue',Arial,sans-serif"
    font-size="9" font-weight="500"
    letter-spacing="5"
    fill="#0891b2">TECHNOLOGIES</text>

  <!-- Tagline dot accent -->
  <circle cx="302" cy="44" r="3" fill="#06b6d4" opacity="0.8"/>
  <circle cx="308" cy="44" r="2" fill="#0891b2" opacity="0.5"/>
  <circle cx="313" cy="44" r="1.5" fill="#1e3a5f" opacity="0.4"/>
</svg>
